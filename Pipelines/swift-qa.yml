trigger: none

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - Pipelines/*
    
pool: Swift

steps:
  - task: UseNode@1
    inputs:
      version: "24.x"
    displayName: "Install Node.js"

  - script: |
      npm ci
    displayName: "npm ci"

  - script: |
      npm run lint
    displayName: "npm run lint"

  - script: |
      npm run build --verbose
    displayName: "npm run build"

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: "$(Build.SourcesDirectory)/Files"
      includeRootFolder: false
      archiveType: "zip"
      archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
      replaceExistingArchive: true
    displayName: "Zip Files"

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: "$(Build.ArtifactStagingDirectory)"
      ArtifactName: "swift"
      publishLocation: "Container"
    displayName: "Publish artifact"

  # Posts once per PR, as the build service; it needs "Contribute to pull requests" on the repo
  - powershell: |
      # Windows PowerShell 5.1 does not use TLS 1.2 by default, which dev.azure.com requires
      [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
      $marker = "will be available for test soon"
      $comment = "PR: $(System.PullRequest.PullRequestId) $marker - QA: $(qa-url) / QA-MAIN: $(qa-main-url)"
      $url = "$(System.CollectionUri)$(System.TeamProjectId)/_apis/git/repositories/$(Build.Repository.ID)/pullRequests/$(System.PullRequest.PullRequestId)/threads?api-version=7.1"
      $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }

      # Later pushes to the PR rebuild the same test sites, so the link is only posted on the first build
      $threads = Invoke-RestMethod -Method Get -Uri $url -Headers $headers
      if ($threads.value | Where-Object { $_.comments | Where-Object { $_.content -like "*$marker*" } }) {
        Write-Host "Test site link already posted on this PR"
        exit 0
      }

      $body = @{
        comments = @(@{ parentCommentId = 0; content = $comment; commentType = "system" })
        status = "byDesign"
      } | ConvertTo-Json -Depth 3
      Invoke-RestMethod -Method Post -Uri $url -ContentType "application/json" -Body $body -Headers $headers | Out-Null
    condition: eq(variables['Build.Reason'], 'PullRequest')
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    displayName: Add comment to PR with link to test site