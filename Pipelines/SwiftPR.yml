pr:
  autoCancel: true
  branches:
    include:
    - main
    - features/*
  paths:
    exclude:
    - Pipelines/*

pool: Swift

steps:  
  - task: UseNode@1
    inputs:
      version: "20.x"
    displayName: "Install Node.js"

  - script: |
      npm ci
      npm run build --verbose
    displayName: 'Run npm build'

  - powershell: |
      New-Item -ItemType Directory -Force $(System.PullRequest.PullRequestId)
      Move-Item Files $(System.PullRequest.PullRequestId)\Files
      Copy-Item "\\dwis-dev09\Dynamicweb.net\swift\database.bak" $(System.PullRequest.PullRequestId)
    workingDirectory: $(Build.SourcesDirectory)
    displayName: 'Clean build and add database'
  
  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: "$(Build.SourcesDirectory)/$(System.PullRequest.PullRequestId)"
      includeRootFolder: true
      archiveType: "zip"
      archiveFile: "$(Build.ArtifactStagingDirectory)/$swift-pr(System.PullRequest.PullRequestId).zip"
      replaceExistingArchive: true
    displayName: "Zip Files"

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: "$(Build.ArtifactStagingDirectory)"
      ArtifactName: "swift"
      publishLocation: "Container"
    displayName: "Publish artifact"
