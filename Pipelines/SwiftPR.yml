pr:
  autoCancel: true
  branches:
    include:
    - main
    - features/*
  paths:
    exclude:
    - Pipelines/*

pool: Swift

variables:
- name: templateName
  value: "swift-prswift-pr$(System.PullRequest.PullRequestId)"

steps:  
  - task: UseNode@1
    inputs:
      version: "20.x"
    displayName: "Install Node.js"

  - script: |
      npm install
      npm run build --verbose
    displayName: 'Run npm build'

  - powershell: |
      New-Item -ItemType Directory -Force 
      Move-Item Files $(System.PullRequest.PullRequestId)\Files
      Copy-Item "\\dwis-dev09\Dynamicweb.net\swift\database.bak" $(templateName)
    workingDirectory: $(Build.SourcesDirectory)
    displayName: 'Clean build and add database'
  
  - powershell: |
      "$(System.PullRequest.PullRequestId)" | Out-File "$(Build.ArtifactStagingDirectory)\prid.txt"
    displayName: 'Save PR ID'
    
  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: "$(Build.SourcesDirectory)/$(System.PullRequest.PullRequestId)"
      includeRootFolder: true
      archiveType: "zip"
      archiveFile: "$(Build.ArtifactStagingDirectory)/$(templateName).zip"
      replaceExistingArchive: true
    displayName: "Zip Files"

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: "$(Build.ArtifactStagingDirectory)"
      ArtifactName: "swift"
      publishLocation: "Container"
    displayName: "Publish artifact"
